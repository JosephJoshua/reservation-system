<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>球馆管理</title>
    <script>
      // Sets the theme before the first paint, so a forced 外观 does not flash. Same rule as theme.ts.
      try {
        const choice = localStorage.getItem('rs:theme')
        const dark =
          choice === 'dark' ||
          (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('theme-mode', dark ? 'dark' : 'light')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
